name: Refresh Nix packaging

on:
  workflow_dispatch:
  schedule:
    - cron: "53 4 * * *"
  workflow_run:
    workflows: ["Sync upstream"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-nix
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Refresh denoDepsHash
        run: bash scripts/nix/refresh-deno-deps-hash.sh

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git add flake.nix
          git commit -m "nix: refresh denoDepsHash"

      - name: Push to default branch or open PR
        if: steps.diff.outputs.changed == 'true'
        run: |
          if git push origin HEAD:"$DEFAULT_BRANCH"; then
            echo "updated $DEFAULT_BRANCH directly"
            exit 0
          fi

          branch="ci/refresh-nix"
          git push -f origin HEAD:"refs/heads/$branch"

          pr_number="$(gh pr list \
            --base "$DEFAULT_BRANCH" \
            --head "$branch" \
            --state open \
            --json number \
            --jq '.[0].number // ""')"

          if [ -z "$pr_number" ]; then
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --title "Refresh Nix packaging metadata" \
              --body "Automated refresh of \\`denoDepsHash\\` after upstream or flake input changes."
          else
            echo "updated existing PR #$pr_number"
          fi
